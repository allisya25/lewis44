<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPC Workshop Management System – Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#4A2C1D; --navy-2:#6B4430; --blue:#0F766E; --sky:#14A098; --sky-2:#8FD3CC; --pale:#E7F5F3; --pale-2:#F6FBFA;
  --ink:#2A1E17; --muted:#7A6A5E; --line:#EEE6DE; --bg:#FFFFFF; --soft:#FBF8F5;
  --radius:12px; --shadow:0 1px 2px rgba(74,44,29,.06),0 2px 8px rgba(74,44,29,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Layout ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:256px;background:#FBF8F5;color:var(--ink);display:flex;flex-direction:column;z-index:40;transition:transform .25s;border-right:1px solid var(--line)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:22px 22px 16px;border-bottom:1px solid var(--line);margin-bottom:6px}
.logo-img{width:150px;height:auto;display:block}
.sppe-logo{display:flex;align-items:center;gap:11px;text-decoration:none;cursor:pointer}
.sppe-mark{width:48px;height:48px;flex:none;filter:drop-shadow(0 6px 10px rgba(15,118,110,.25))}
.sppe-txt b{display:block;font-size:22px;font-weight:800;letter-spacing:1px;color:#4A2C1D;line-height:1}
.sppe-txt span{display:block;white-space:nowrap;font-size:10.5px;font-weight:600;color:#7A6A5E;line-height:1.3;margin-top:4px}
.org-line{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#A8988A;font-weight:700;margin-top:-4px;padding-left:59px}
.home-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;cursor:pointer;color:var(--navy);font-weight:700;font-size:13px}
.home-btn:hover{background:#E7F5F3;border-color:#CFE9E5;color:#0F766E}
.home-btn.on{background:#E7F5F3;border-color:#CFE9E5;color:#0F766E}
@media (max-width:900px){.home-btn span{display:none}}
.brand-sub{border-left:3px solid #14A098;padding-left:10px}
.dept-tag{background:#fff;border:1px solid #EADFD4;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;color:var(--navy);line-height:1.35;width:100%}
.dept-tag small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#A8988A;font-weight:700;margin-bottom:2px}
.dept-tag em{font-style:normal;color:#0F766E}
.dept-chip{display:inline-flex;align-items:center;gap:8px;background:#E7F5F3;color:#0F766E;border:1px solid #CFE9E5;font-weight:700;font-size:12.5px;padding:5px 12px;border-radius:20px;margin-bottom:10px}
.logo{width:46px;height:46px;border-radius:12px;border:1.5px dashed #C9AE95;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--navy);background:#fff;text-align:center;line-height:1.1}
.brand b{display:block;color:var(--navy);font-size:16px;font-weight:800;letter-spacing:-.2px}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{padding:6px 14px;flex:1;overflow:auto}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:#A8988A;padding:12px 12px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#5A4A3F;text-decoration:none;font-weight:600;margin-bottom:2px;cursor:pointer;font-size:13.5px}
.nav a:hover{background:#F2EAE2;color:var(--navy)}
.nav a.active{background:linear-gradient(135deg,#0F766E,#14A098);color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.28)}
.nav a .num{margin-left:auto;font-size:11px;background:#EADFD4;color:var(--navy);padding:1px 8px;border-radius:20px}
.nav a.active .num{background:rgba(255,255,255,.22);color:#fff}
.promo{margin:10px 16px 14px;border-radius:16px;padding:18px 16px;background:linear-gradient(150deg,#5C3A26,#3A2317);color:#fff;text-align:center;position:relative;overflow:hidden}
.promo:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(20,160,152,.35);top:-50px;right:-40px}
.promo .pi{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;margin:0 auto 10px;color:#5EEAD4}
.promo b{display:block;font-size:14px;line-height:1.35;position:relative;z-index:1}
.promo small{display:block;color:#E2CDB9;font-size:11.5px;margin:4px 0 12px;position:relative;z-index:1}
.promo .btn{width:100%;justify-content:center;background:#fff;color:var(--navy);border:0;position:relative;z-index:1}
.side-foot{padding:12px 20px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}
.side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#14A098;margin-right:6px}

.main{margin-left:256px;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 28px}
.menu-btn{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px;cursor:pointer}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 12px 9px 36px;outline:none}
.search input:focus{border-color:var(--sky);background:#fff;box-shadow:0 0 0 3px var(--pale)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.role{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.role select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;font-size:13px;color:var(--ink)}
.icon-btn{position:relative;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;cursor:pointer;color:var(--navy)}
.icon-btn .badge{position:absolute;top:-4px;right:-4px;background:#E11D48;color:#fff;font-size:10px;border-radius:10px;padding:0 5px;line-height:16px}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--pale);color:var(--navy);display:grid;place-items:center;font-weight:700}
.user small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.user b{font-size:13px}

.content{padding:26px 28px 40px;max-width:1440px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:4px}
.crumbs a{text-decoration:none;cursor:pointer}
h1{font-size:23px;margin:0;color:var(--navy);letter-spacing:-.2px}
.sub{color:var(--muted);margin:4px 0 0}
h2{font-size:15px;margin:0;color:var(--navy)}
h3{font-size:13.5px;margin:0 0 8px;color:var(--navy)}

/* ---------- Components ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;color:var(--navy);white-space:nowrap}
.btn:hover{border-color:var(--sky-2);background:var(--pale-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.sky{background:var(--sky);border-color:var(--sky);color:#fff}
.btn.danger{background:#B91C1C;border-color:#B91C1C;color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--pale)}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0}
.card-h .hint{font-size:12px;color:var(--muted)}
.card-b{padding:16px 18px 18px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.mt{margin-top:18px}

.kpi{padding:18px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;transition:transform .15s, box-shadow .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(74,44,29,.09)}
.kpi .ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;flex:none}
.kpi .ic svg{width:22px;height:22px}
.kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .val{font-size:28px;font-weight:700;color:var(--navy);line-height:1.15;margin-top:2px}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:4px}

.banner{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,var(--pale),#fff);border:1px solid #CFE9E5;border-radius:var(--radius);padding:12px 16px;margin-bottom:18px;color:var(--navy);font-size:13px}
.banner svg{color:var(--sky)}
.pulse{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 2s infinite;flex:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

.status{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-Draft{background:#F1F5F9;color:#475569}
.s-Upcoming{background:#E0F2F1;color:#0F766E}
.s-Ongoing{background:#FEF3C7;color:#B45309}
.s-Completed{background:#F3EAE2;color:#6B4430}
.s-Cancelled{background:#FEE2E2;color:#B91C1C}
.chip{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;background:var(--pale);color:var(--navy);font-weight:500}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:inherit;font-size:11px;fill:#8A7B70}
svg.chart rect.bar{transition:opacity .15s}
svg.chart rect.bar:hover{opacity:.8}

.list{display:flex;flex-direction:column}
.sched{display:flex;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sched:last-child{border-bottom:0}
.sched:hover .t{color:var(--blue)}
.datebox{width:52px;flex:none;text-align:center;border-radius:10px;background:var(--pale);color:var(--navy);padding:6px 0}
.datebox b{display:block;font-size:18px;line-height:1.1}
.datebox span{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.sched .t{font-weight:600;color:var(--ink)}
.sched .m{font-size:12px;color:var(--muted)}
.sched .r{margin-left:auto}
.act{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.act .tx{font-size:13px}
.act .tx a{font-weight:600;text-decoration:none;cursor:pointer}
.act .tm{font-size:11.5px;color:var(--muted)}

/* Table */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--sky)}
.toolbar .grow{flex:1;min-width:200px}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line)}
.tab{padding:12px 14px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--navy);border-bottom-color:var(--sky)}
.tab .n{font-size:11px;background:var(--pale);color:var(--navy);border-radius:10px;padding:1px 7px;margin-left:6px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;padding:11px 14px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#FCFAF7}
td .tt{font-weight:600;color:var(--ink);cursor:pointer}
td .tt:hover{color:var(--blue)}
td .id{font-size:11.5px;color:var(--muted)}
.actions{display:flex;gap:4px;justify-content:flex-end}
.actions button{border:1px solid transparent;background:none;border-radius:7px;padding:6px;cursor:pointer;color:var(--navy)}
.actions button:hover{background:var(--pale);border-color:#CFE9E5}
.actions button[disabled]{opacity:.3;cursor:not-allowed;background:none}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.tfoot{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-size:12.5px;color:var(--muted)}

/* Details */
.detail-hero{padding:22px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:var(--radius) var(--radius) 0 0}
.detail-hero h1{color:#fff;font-size:22px;margin:8px 0 4px}
.detail-hero .id{color:#E2CDB9;font-size:12.5px}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.info div{padding:16px 22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.info div:nth-child(3n){border-right:0}
.info label{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:4px}
.info span{font-weight:600}
.placeholder{border:1.5px dashed #D9CBBE;background:var(--pale-2);border-radius:10px;padding:18px;color:var(--muted);text-align:center;font-size:13px}
.timeline{position:relative;padding-left:18px}
.timeline:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 14px}
.tl:before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--sky)}
.tl b{font-size:13px}
.tl div{font-size:11.5px;color:var(--muted)}

/* Calendar */
.cal-head{display:flex;align-items:center;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{background:var(--soft);font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .day{min-height:108px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
.cal .day.out{background:#FCFAF8;color:#C9BDB2}
.cal .day .dn{font-size:12px;font-weight:600;margin-bottom:4px;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%}
.cal .day.today .dn{background:var(--navy);color:#fff}
.ev{display:block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid currentColor}

/* Programme */
.prog{padding:18px;display:flex;flex-direction:column;gap:10px}
.prog .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.progress{height:8px;background:var(--pale);border-radius:10px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--blue));border-radius:10px}
.prog small{color:var(--muted)}
.gantt{overflow-x:auto}
.gantt-row{display:grid;grid-template-columns:260px 1fr;align-items:center;border-bottom:1px solid var(--line);min-width:820px}
.gantt-row .nm{padding:10px 14px;font-weight:600;font-size:13px}
.gantt-row .track{position:relative;height:40px;border-left:1px solid var(--line)}
.gantt-months{display:grid;grid-template-columns:repeat(12,1fr);font-size:11px;color:var(--muted);text-align:center}
.gantt-months span{padding:8px 0;border-left:1px solid var(--line)}
.gbar{position:absolute;top:13px;height:14px;border-radius:7px;background:var(--sky);min-width:6px}
.gbar.c{background:var(--navy)} .gbar.x{background:#F87171}

/* Hbar */
.hbar{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;margin-bottom:10px;font-size:12.5px}
.hbar .tr{height:12px;background:var(--pale);border-radius:8px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:8px}
.hbar b{text-align:right;color:var(--navy)}

/* Docs */
.folder{padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer}
.folder .fi{width:42px;height:42px;border-radius:10px;background:var(--pale);color:var(--blue);display:grid;place-items:center}
.folder small{color:var(--muted);display:block}
.ftype{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;font-size:10px;font-weight:700;color:#fff}

/* Users / settings */
.perm td,.perm th{text-align:center}
.perm td:first-child,.perm th:first-child{text-align:left}
.yes{color:#B45309;font-weight:700} .no{color:#CBD5E1}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row small{display:block;color:var(--muted)}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#CBD5E1;border-radius:22px;cursor:pointer;transition:.2s}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--sky)}
.switch input:checked+span:before{transform:translateX(18px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(42,30,23,.45);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:40px 16px;overflow:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s ease-out}
.modal.small{max-width:440px}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:17px}
.modal-b{padding:20px 22px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:var(--soft);border-radius:0 0 14px 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--navy)}
.field label .req{color:#DC2626}
.field input,.field select,.field textarea{width:100%;border:1px solid #E2D8CE;border-radius:9px;padding:9px 11px;background:#fff;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px var(--pale)}
.field .help{font-size:11.5px;color:var(--muted);margin-top:4px}
.field.err input,.field.err select{border-color:#DC2626}
.field .msg{font-size:11.5px;color:#DC2626;margin-top:4px;display:none}
.field.err .msg{display:block}
.note{background:var(--pale-2);border:1px solid #CFE9E5;border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--navy);display:flex;gap:8px;align-items:flex-start}

.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:10px}

/* ---------- v2 refinements ---------- */
body{font-feature-settings:"tnum" 1,"cv11" 1}
.main{background:#FBF9F6}
.topbar{background:rgba(255,255,255,.96)}
h1{font-size:25px;font-weight:800;letter-spacing:-.4px}
h2{font-size:15.5px;font-weight:700;letter-spacing:-.1px}
.card{border-color:#EFE7DF;border-radius:16px;box-shadow:0 1px 2px rgba(74,44,29,.04),0 8px 24px rgba(74,44,29,.04)}
.btn{border-radius:10px}
.btn.primary{background:linear-gradient(135deg,#0F766E,#14A098);border-color:#0F766E;box-shadow:0 6px 14px rgba(15,118,110,.25)}
.btn.primary:hover{background:#0F766E}
.g5{grid-template-columns:repeat(5,1fr)}
.kpi{padding:20px;align-items:center}
.kpi .ic{width:54px;height:54px;border-radius:50%;color:#fff!important;box-shadow:0 8px 18px -6px var(--sh,rgba(0,0,0,.3))}
.kpi .ic svg{width:24px;height:24px}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.5px}
.trend{font-size:12px;font-weight:700;color:#0F766E;margin-top:4px}
.trend span{color:var(--muted);font-weight:500;margin-left:4px}
.trend.down{color:#B91C1C}
.mini-select{border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:#fff;font-size:12.5px;font-weight:600;color:var(--navy);cursor:pointer}
.tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.tile svg{width:22px;height:22px}
.sched .time{width:100px;flex:none;font-size:12px;font-weight:700;color:var(--navy);line-height:1.35;border-right:1px solid var(--line);padding-right:10px}
.sched .time span{display:block;color:var(--muted);font-weight:500}
.now{display:grid;grid-template-columns:2fr 1.1fr 1.2fr 1.1fr .8fr;gap:0;padding:6px 8px}
.now > div{display:flex;gap:12px;align-items:center;padding:14px 16px;border-right:1px solid var(--line)}
.now > div:last-child{border-right:0}
.now svg{color:#8B5E3C;width:26px;height:26px;flex:none}
.now label{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.now b{font-size:13.5px;color:var(--ink)}
.live-nav{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-weight:700;color:#4A2C1D}
.live-nav button{border:1px solid var(--line);background:#fff;border-radius:6px;width:20px;height:20px;line-height:16px;cursor:pointer;color:#4A2C1D;padding:0}
.live{display:inline-flex;align-items:center;gap:6px;background:#FEF3C7;color:#B45309;font-weight:700;font-size:12px;padding:3px 10px;border-radius:20px}
.live i{width:7px;height:7px;border-radius:50%;background:#D97706;animation:pulse 2s infinite}
.dleg{display:flex;flex-direction:column;gap:9px;font-size:12.5px;flex:1}
.dleg div{display:flex;align-items:center;gap:8px;white-space:nowrap}
.dleg i{width:10px;height:10px;border-radius:50%;flex:none}
.dleg span{margin-left:auto;color:var(--muted);font-weight:600}
.pills{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px 0}
.pill{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font-weight:600;font-size:13px;color:#5A4A3F;cursor:pointer}
.pill:hover{border-color:#CDB79E}
.pill.on{background:#4A2C1D;border-color:#4A2C1D;color:#fff}
.pill .n{opacity:.65;margin-left:6px;font-weight:500}
.vtoggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.vtoggle button{border:0;background:none;padding:7px 10px;cursor:pointer;color:var(--muted);display:flex}
.vtoggle button.on{background:#E7F5F3;color:#0F766E}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;padding:18px}
.wcard{border:1px solid #EFE7DF;border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s}
.wcard:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(74,44,29,.10)}
.cover{height:120px;position:relative;display:flex;align-items:flex-end;padding:14px;color:#fff;overflow:hidden}
.cover:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.10);right:-50px;top:-70px}
.cover:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08);right:60px;bottom:-60px}
.cover .big{position:absolute;right:18px;top:18px;opacity:.9}
.cover .big svg{width:40px;height:40px;stroke-width:1.5}
.cover .cat{position:relative;z-index:1;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px;backdrop-filter:blur(4px)}
.wcard .bd{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.wcard h4{margin:0;font-size:15px;color:var(--navy);line-height:1.35}
.wcard p{margin:0;color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wcard .meta{font-size:12px;color:#5A4A3F;display:flex;flex-direction:column;gap:4px;margin-top:2px}
.wcard .meta span{display:flex;gap:6px;align-items:center}
.wcard .meta svg{width:14px;height:14px;color:#8B5E3C}
.wcard .ft{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
table.tbrand th{background:#4A2C1D;color:#fff;border-bottom:0}
table.tbrand tr:nth-child(even) td{background:#FCFAF7}
svg.chart text{font-size:11.5px}

/* ---------- SPPE Diary ---------- */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.dcard{background:#fff;border:1px solid #EFE7DF;border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.dcard:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(74,44,29,.10)}
.dcover{height:180px;position:relative;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff}
.dcover .cnt{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;display:flex;gap:6px;align-items:center}
.dcover .cnt svg{width:14px;height:14px}
.dcover .nop{text-align:center;font-size:12.5px;font-weight:600;opacity:.95}
.dcover .nop svg{width:34px;height:34px;display:block;margin:0 auto 6px;stroke-width:1.5}
.dcard .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.dcard .dt{font-size:11.5px;font-weight:700;color:#C8102E;letter-spacing:.4px;text-transform:uppercase}
.dcard h4{margin:0;font-size:14.5px;line-height:1.4;color:var(--navy)}
.dcard .loc{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dcard .loc svg{width:14px;height:14px}
.poster{background:#fff;border:1px solid #EFE7DF;border-radius:16px;overflow:hidden}
.poster-top{display:flex;justify-content:space-between;align-items:flex-start;padding:26px 32px 0;gap:20px}
.poster-top img{height:52px;width:auto}
.poster-date{text-align:right;min-width:190px}
.poster-date b{display:block;font-size:20px;font-weight:800;color:#111;padding-bottom:6px;border-bottom:3px solid #C8102E}
.poster-date span{display:block;font-weight:800;margin-top:6px;color:#111}
.poster h1{text-align:center;text-transform:uppercase;color:#111;font-size:26px;line-height:1.3;max-width:860px;margin:30px auto 26px;padding:0 24px;font-weight:800;letter-spacing:.2px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:0 32px 28px}
.gallery.feature{grid-template-columns:1fr 1fr}
.ph{position:relative;border-radius:10px;overflow:hidden;cursor:zoom-in;background:#F3EAE2;aspect-ratio:4/3}
.gallery.feature .ph:first-child{grid-column:1/-1;aspect-ratio:16/7}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.ph:hover img{transform:scale(1.04)}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 9px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));opacity:0;transition:opacity .2s}
.ph:hover .cap{opacity:1}
.ph .new{position:absolute;top:8px;left:8px;background:#14A098;color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px}
.poster-foot{background:#C8102E;color:#fff;text-align:center;font-weight:800;font-size:17px;padding:12px;letter-spacing:.2px}
.poster-foot b{color:#FFE2E2;font-weight:800}
.diary-text{font-size:14px;line-height:1.75;color:#3A2E27;white-space:pre-wrap}
.dropzone{border:2px dashed #CDB79E;border-radius:14px;padding:30px 20px;text-align:center;background:#FCFAF7;cursor:pointer;color:var(--muted);transition:.15s}
.dropzone:hover,.dropzone.over{border-color:#14A098;background:#F0FAF8;color:#0F766E}
.dropzone svg{width:36px;height:36px;color:#14A098;stroke-width:1.5}
.dropzone b{display:block;color:var(--navy);margin:6px 0 2px}
.pend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.pend div{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;position:relative}
.pend img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.pend input{border:0;border-top:1px solid var(--line);width:100%;padding:7px 9px;font-size:12px;outline:none}
.pend button{position:absolute;top:6px;right:6px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.modal.lightbox{max-width:1000px;background:#1C1410;color:#fff}
.lb-img{position:relative;display:flex;align-items:center;justify-content:center;background:#000;min-height:300px}
.lb-img img{max-width:100%;max-height:70vh;display:block}

/* ===== v4: clash warnings, audit log, dark mode, a11y, print, quarterly KPI ===== */
.clash{border-radius:10px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.clash svg{margin-top:1px}
.clash.hard{background:#FEF2F2;border:1px solid #FCA5A5;color:#7F1D1D}
.clash.soft{background:#FFFBEB;border:1px solid #FCD34D;color:#78350F}
.clash.ok{background:#F0FAF8;border:1px solid #CFE9E5;color:#0B5E57}
.clash ul{margin:6px 0 0;padding-left:18px}
.clash li{margin:2px 0}
.clash .cf{margin-top:8px;font-weight:700}
.chip-clash{display:inline-flex;align-items:center;gap:4px;background:#FEE2E2;color:#991B1B;border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.chip-clash svg{width:12px;height:12px}
.clash-banner{margin-bottom:14px}
/* audit */
.au-filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.au-filters label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.au-filters input,.au-filters select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
.au-table td{vertical-align:top}
.au-ch{margin:0;padding:0;list-style:none;font-size:12.5px}
.au-ch li{margin:1px 0}
.au-ch b{font-weight:600;color:var(--muted)}
.au-ch del{color:#B91C1C;text-decoration:line-through;text-decoration-color:rgba(185,28,28,.5)}
.au-ch ins{color:#0F766E;text-decoration:none;font-weight:600}
.au-kind{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;margin-right:6px}
.au-kind.k-create{background:#E0F2F1;color:#0F766E}.au-kind.k-edit{background:#F3EAE2;color:#6B4430}.au-kind.k-status{background:#FEF3C7;color:#92400E}
.au-kind.k-delete{background:#FEE2E2;color:#991B1B}.au-kind.k-archive{background:#F1F5F9;color:#475569}.au-kind.k-diary{background:#F3E8FF;color:#6B21A8}.au-kind.k-clash{background:#FEE2E2;color:#991B1B}.au-kind.k-other{background:#F1F5F9;color:#475569}
.au-sum{display:flex;gap:18px;flex-wrap:wrap;padding:12px 18px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.au-sum b{color:var(--navy)}
@media (max-width:900px){.au-filters{grid-template-columns:1fr 1fr}}
/* quarterly KPI */
.qk td,.qk th{text-align:center}
.qk td:first-child,.qk th:first-child{text-align:left}
.qk .cell b{font-size:15px;color:var(--navy)}
.qk .cell small{color:var(--muted)}
.qk .bar{height:6px;border-radius:99px;background:#EEE6DE;margin:6px auto 4px;max-width:120px;overflow:hidden}
.qk .bar i{display:block;height:100%;border-radius:99px}
.qk .tag{font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 7px}
.tag.t-ok{background:#E0F2F1;color:#0F766E}.tag.t-mid{background:#FEF3C7;color:#92400E}.tag.t-bad{background:#FEE2E2;color:#991B1B}.tag.t-na{background:#F1F5F9;color:#64748B}
.kpi-form{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:8px 10px;align-items:center}
.kpi-form input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.kpi-form .h{font-size:11.5px;font-weight:700;color:var(--muted)}
/* accessibility */
.skip{position:fixed;left:12px;top:-60px;z-index:200;background:#0F766E;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;transition:top .15s}
.skip:focus{top:12px}
:focus-visible{outline:3px solid #0F766E!important;outline-offset:2px}
.nav a:focus-visible{outline-offset:-3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

/* dark mode (inverts the interface; photos, logos and maps are flipped back) */
html.dark{filter:invert(.92) hue-rotate(180deg);background:#fff}
html.dark img,html.dark video,html.dark canvas,html.dark iframe,html.dark [style*="background-image"],html.dark [style*="url("],html.dark .keep-colour{filter:invert(1) hue-rotate(180deg)}

.print-head{display:none}

  .print-head{display:flex!important;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #0F766E;padding-bottom:8px;margin-bottom:14px}
  .print-head b{font-size:15px;color:#4A2C1D}
  .print-head small{display:block;color:#7A6A5E;font-size:10.5px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

const to12 = t => { if(!t) return ''; let [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${String(m).padStart(2,'0')} ${ap}`; };
const fmtTime = w => w.startTime ? `${to12(w.startTime)} – ${to12(w.endTime||'17:00')}` : '9:00 AM – 5:00 PM';
function lineChart(labels, series){
  const W=680,H=290,pl=34,pr=14,pt=16,pb=30;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.values)));
  const iw=W-pl-pr, ih=H-pt-pb, step=labels.length>1?iw/(labels.length-1):iw;
  const X=i=>pl+i*step, Yv=v=>pt+ih-ih*v/max;
  let g='<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14A098" stop-opacity=".28"/><stop offset="1" stop-color="#14A098" stop-opacity="0"/></linearGradient></defs>';
  for(let i=0;i<=4;i++){ const y=pt+ih-ih*i/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#F1EBE5"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${Math.round(max*i/4)}</text>`; }
  const smooth=pts=>pts.map((p,i)=>{ if(!i) return `M${p[0]},${p[1]}`; const q=pts[i-1], cx=(q[0]+p[0])/2; return `C${cx},${q[1]} ${cx},${p[1]} ${p[0]},${p[1]}`; }).join(' ');
  series.forEach(s=>{
    const pts=s.values.map((v,i)=>[X(i),Yv(v)]), d=smooth(pts);
    if(s.fill) g+=`<path d="${d} L${X(pts.length-1)},${pt+ih} L${X(0)},${pt+ih} Z" fill="url(#ga)"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.fill?3:2.2}" ${s.fill?'':'stroke-dasharray="5 5"'} stroke-linecap="round"/>`;
    pts.forEach((p,i)=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${s.fill?4.5:3.2}" fill="#fff" stroke="${s.color}" stroke-width="2.2"><title>${s.name} · ${labels[i]}: ${s.values[i]} workshop${s.values[i]===1?'':'s'}</title></circle>`);
  });
  labels.forEach((l,i)=>g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${l}</text>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly workshop activity">${g}</svg>`;
}

function niceMax(v){ for(const s of [4,8,12,16,20,40,60,80,100,120,160,200]) if(s>=v) return s; return Math.ceil(v/50)*50; }
function barChart(labels, series, o={}){
  const W=o.w||640,H=o.h||250,pl=34,pr=8,pt=18,pb=28;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.values)));
  const iw=W-pl-pr, ih=H-pt-pb, gw=iw/labels.length, n=series.length, bw=Math.min(o.bw||22,(gw*.72)/n);
  let g='';
  for(let i=0;i<=4;i++){ const y=pt+ih-ih*i/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#F1EBE5"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${Math.round(max*i/4)}</text>`; }
  labels.forEach((l,i)=>{
    const cx=pl+gw*i+gw/2;
    series.forEach((s,j)=>{
      const v=s.values[i]||0, h=ih*v/max, x=cx-(n*bw)/2+j*bw+1, y=pt+ih-h;
      g+=`<rect class="bar" x="${x}" y="${y}" width="${bw-2}" height="${Math.max(h,0)}" rx="3" fill="${s.color}"><title>${s.name} · ${l}: ${v} workshop${v===1?'':'s'}</title></rect>`;
      if(o.values && v) g+=`<text x="${x+(bw-2)/2}" y="${y-5}" text-anchor="middle" style="font-weight:600;fill:#4A2C1D">${v}</text>`;
    });
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${l}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Bar chart')}">${o.defs?'<defs>'+o.defs+'</defs>':''}${g}</svg>`;
}
function donut(segs, label){
  const total=segs.reduce((a,s)=>a+s.v,0)||1, r=62, c=2*Math.PI*r; let acc=0, g='';
  segs.forEach(s=>{ if(!s.v) return; const len=c*s.v/total; g+=`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${s.color}" stroke-width="22" stroke-dasharray="${len-2} ${c-len+2}" stroke-dashoffset="${-acc}" transform="rotate(-90 90 90)"><title>${s.name}: ${s.v}</title></circle>`; acc+=len; });
  return `<svg class="chart" viewBox="0 0 180 180" style="max-width:190px;margin:auto">${g}<text x="90" y="88" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#4A2C1D">${total}</text><text x="90" y="108" text-anchor="middle">${label}</text></svg>`;
}
function hbars(rows,color){
  const max=Math.max(1,...rows.map(r=>r[1]));
  return rows.map(([k,v])=>`<div class="hbar"><span title="${esc(k)}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(k)}</span><div class="tr"><i style="width:${v/max*100}%;background:${color}"></i></div><b>${v}</b></div>`).join('');
}

function monthlyCounts(year){
  const arr=Array(12).fill(0);
  DB.workshops.forEach(w=>{ const d=pd(w.start); if(d.getFullYear()===year && w.status!=='Cancelled' && w.status!=='Draft') arr[d.getMonth()]++; });
  return arr;
}
const PREV_YEAR_MONTHLY=[1,2,1,1,2,2,1,2,2,2,2,2]; // dummy historical records
const ANNUAL_HIST={2022:16,2023:19,2024:22,2025:24};  // dummy historical records

/* ---------- Router ---------- */
function go(route,id){ if(id) state.currentId=id; if(location.hash!=='#'+route) location.hash=route; else render(); document.body.classList.remove('nav-open'); }
function readHash(){ const h=location.hash.replace('#',''); state.route = NAV.some(n=>n.id===h)||h==='workshop-details'||h==='workshop-diary' ? h : 'dashboard'; }
window.addEventListener('hashchange',()=>{ readHash(); render(); window.scrollTo(0,0); });

const ADMIN_ROUTES=['reports','documents','users','audit','settings'];
function renderNav(){
  const cur = state.route==='workshop-details' ? 'workshops' : state.route==='workshop-diary' ? 'diary' : state.route;
  const st=isStaffRole();
  document.getElementById('nav').innerHTML = `<div class="nav-label">Main menu</div>` + NAV.filter(n=>st||!ADMIN_ROUTES.includes(n.id)).map((n,i)=>
    (i===5?`<div class="nav-label">Administration</div>`:'')+
    `<a class="${cur===n.id?'active':''}" data-action="nav" data-route="${n.id}">${ic(n.icon)}<span>${n.id==='workshops'&&!st?'Workshops':n.label}</span>${n.count?`<span class="num">${active().length}</span>`:''}</a>`).join('')
    + `<div class="nav-sep"></div><a class="nav-logout" data-action="logout">${ic('logout')}<span>Log Out</span></a>`;
}
function render(){
  if(!isStaffRole() && ADMIN_ROUTES.includes(state.route)){ state.route='dashboard'; try{ history.replaceState(null,'','#dashboard'); }catch(_){} }
  if(!isStaffRole() && state.route==='workshop-details'){ const cw=byId(state.currentId); if(cw && (cw.archived || cw.status==='Draft')) state.route='workshops'; }
  renderNav();
  document.getElementById('roleLabel').textContent=ROLES[state.role]; updateBell();
  const pr=document.querySelector('.promo'); if(pr) pr.style.display=isStaffRole()?'':'none';
  document.getElementById('homeBtn').classList.toggle('on',state.route==='dashboard');
  document.getElementById('roleSelect').value=state.role;
  const v=document.getElementById('view');
  const map={diary:vDiaryList,'workshop-diary':vDiary,dashboard:vDashboard,workshops:vWorkshops,'workshop-details':vDetails,calendar:vCalendar,programmes:vProgrammes,reports:vReports,documents:vDocuments,users:vUsers,audit:vAudit,settings:vSettings};
  v.innerHTML=(map[state.route]||vDashboard)();
  const rv=document.getElementById('rvToggle'); if(rv){ rv.style.display = SHARED && state.realRole==='admin' ? '' : 'none'; rv.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v===(state.preview||'admin'))); }
  if(SHARED && state.preview) v.insertAdjacentHTML('afterbegin',`<div class="pv-bar">${ic('eye')}<div style="flex:1;min-width:200px"><b>Preview mode: you are viewing the system as a Participant.</b> Only the display changes — your Administrator access stays the same.</div><button class="btn sm" data-action="rv" data-v="admin">${ic('back')} Back to Administrator view</button></div>`);
  if(state.route==='workshops') renderTable();
}

const addBtn = () => can('add') ? `<button class="btn primary" data-action="add">${ic('plus')} Add New Workshop</button>` : '';

const tabFilter = w => !isStaffRole() ? (!w.archived && w.status!=='Draft') : state.tab==='archived' ? !!w.archived : state.tab==='pending' ? (!w.archived && w.approval && w.approval.state==='pending') : !w.archived;
function filtered(){
  const q=state.q.trim().toLowerCase();
  return DB.workshops.filter(tabFilter)
    .filter(w=>!q||[w.title,w.venue,w.id,w.dept,w.category].join(' ').toLowerCase().includes(q))
    .filter(w=>!state.fStatus||w.status===state.fStatus)
    .filter(w=>!state.fCat||w.category===state.fCat)
    .filter(w=>!state.fDept||w.dept===state.fDept)
    .sort((a,b)=>{ const o={Ongoing:0,Upcoming:1,Draft:2,Completed:3,Cancelled:4}; return o[a.status]-o[b.status] || (a.status==='Completed'||a.status==='Cancelled' ? b.start.localeCompare(a.start) : a.start.localeCompare(b.start)); });
}
function rowActions(w,arch){
  if(!isStaffRole()) return `<button title="View details" data-action="view" data-id="${w.id}">${ic('eye')}</button>`;
  return `<button title="View details" data-action="view" data-id="${w.id}">${ic('eye')}</button>
      ${arch?`<button title="Restore" data-action="restore" data-id="${w.id}" ${can('archive')?'':'disabled'}>${ic('restore')}</button>`:
      `<button title="Edit" data-action="edit" data-id="${w.id}" ${can('edit')?'':'disabled'}>${ic('edit')}</button>
      <button title="Archive" data-action="archive" data-id="${w.id}" ${can('archive')?'':'disabled'}>${ic('archive')}</button>`}${canDelete(w)?`<button title="Delete" data-action="delete" data-id="${w.id}" style="color:#B91C1C">${ic('trash')}</button>`:''}`;
}

function submitForm(f,w){
  const d=Object.fromEntries(new FormData(f).entries());
  Object.keys(d).forEach(k=>d[k]=typeof d[k]==='string'?d[k].trim():d[k]);
  let ok=true;
  f.querySelectorAll('.field').forEach(x=>x.classList.remove('err'));
  const bad=n=>{ f[n].closest('.field').classList.add('err'); ok=false; };
  ['title','dept','category','start','venue','status'].forEach(n=>{ if(!d[n]) bad(n); });
  if(d.end && d.start && d.end<d.start) bad('end');
  if(!ok) return;
  if(!d.end) d.end=d.start;
  const clashes=findClashes(d, w&&w.id);
  if(clashes.length && f.dataset.clashOk!=='1'){ renderClash(f,w,true); f.dataset.clashOk='1'; const cb=document.getElementById('clashBox'); if(cb) cb.scrollIntoView({block:'center',behavior:'smooth'}); toast('Schedule clash found. Review the warning, then click Save again to confirm.'); return; }
  d.seats=d.seats?Number(d.seats):''; d.budget=d.budget!==''?Number(d.budget):''; d.actualCost=d.actualCost!==''?Number(d.actualCost):'';
  d.programme=d.programme||'Standalone workshop'; d.regLink=/^https:\/\//i.test(d.regLink||'')?d.regLink:''; d.fbLink=/^https:\/\//i.test(d.fbLink||'')?d.fbLink:'';
  if(w){
    let sent=false;
    if(needsApproval(d) && (w.status==='Draft' || (w.approval&&w.approval.state!=='approved'))){ d.status='Draft'; d.approval=newRequest(); sent=true; }
    else if(state.role==='admin' && d.status!=='Draft' && w.approval && w.approval.state==='pending'){ d.approval={...w.approval,state:'approved',by:ME(),uid:SHARED?(SHARED.uid||''):'',at:new Date().toISOString()}; }
    const ch=diffW(w,d);
    Object.assign(w,d,{updated:iso(new Date())}); persistW(w); if(sent){ log('submitted for approval',w.id); toast('Saved as Draft and sent for approval.'); }
    log('edited the details of',w.id,ch); if(clashes.length) log('saved despite a schedule clash for',w.id,clashes.map(x=>({f:'Clashes with',from:'',to:`${x.id} ${x.title} (${x.venue})`}))); toast(`“${esc(w.title)}” has been updated.`);
  } else {
    const y=d.start.slice(0,4); const n=DB.workshops.filter(x=>x.id.startsWith('W-'+y)).map(x=>+x.id.split('-')[2]).reduce((a,b)=>Math.max(a,b),0)+1;
    const nw={id:`W-${y}-${String(n).padStart(3,'0')}`,...d,createdBy:ME(),createdByUid:SHARED?(SHARED.uid||''):'',archived:false,updated:iso(new Date())};
    const sentA=needsApproval(nw); if(sentA){ nw.status='Draft'; nw.approval=newRequest(); }
    DB.workshops.push(nw); persistW(nw); if(sentA) setTimeout(()=>toast('Saved as Draft and sent to an Administrator for approval.'),400); state.currentId=nw.id;
    log('added a new workshop',nw.id,[['title',nw.title],['start',nw.start],['end',nw.end],['venue',nw.venue],['status',nw.status],['budget',nw.budget]].filter(x=>x[1]!==''&&x[1]!=null).map(([f,v])=>({f,from:'',to:v}))); if(clashes.length) log('saved despite a schedule clash for',nw.id,clashes.map(x=>({f:'Clashes with',from:'',to:`${x.id} ${x.title} (${x.venue})`}))); toast(`“${esc(nw.title)}” added and shared with all staff.`);
    state.tab='active';
  }
  save(); closeModal(); render();
}

/* ---------- 4. Calendar ---------- */
function vCalendar(){
  const now=new Date(); if(state.calY===null){ state.calY=now.getFullYear(); state.calM=now.getMonth(); }
  const Y=state.calY,M=state.calM, first=new Date(Y,M,1), start=new Date(Y,M,1-((first.getDay()+6)%7));
  const ws=active().filter(w=>w.status!=='Cancelled');
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); const s=iso(d);
    const evs=ws.filter(w=>w.start<=s && (w.end||w.start)>=s);
    cells+=`<div class="day ${d.getMonth()!==M?'out':''} ${s===iso(now)?'today':''}"><div class="dn">${d.getDate()}</div>${evs.map(w=>`<span class="ev s-${w.status}" data-action="view" data-id="${w.id}" title="${esc(w.title)} · ${esc(w.venue)}">${esc(w.title)}</span>`).join('')}</div>`;
    if(i>=34 && d.getMonth()!==M && d.getDay()===0) break;
  }
  const inMonth=ws.filter(w=>{const a=pd(w.start),b=pd(w.end||w.start);return a<=new Date(Y,M+1,0)&&b>=new Date(Y,M,1);}).sort((a,b)=>a.start.localeCompare(b.start));
  return head('Workshop Calendar','Monthly view of all scheduled workshops. Click a workshop to open its details.',addBtn())+
  `<div class="grid g-2-1" style="grid-template-columns:3fr 1fr">
   <div class="card"><div class="card-h"><div class="cal-head"><button class="btn sm" data-action="cal" data-d="-1">${ic('chevL')}</button><h2 style="min-width:150px;text-align:center">${MONTHS[M]} ${Y}</h2><button class="btn sm" data-action="cal" data-d="1">${ic('chevR')}</button><button class="btn sm ghost" data-action="cal" data-d="0">Today</button></div>
     <div class="legend">${['Upcoming','Ongoing','Completed','Draft'].map(s=>`<span><i style="background:${STATUS_COLOR[s]}"></i>${s}</span>`).join('')}</div></div>
     <div class="card-b"><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div></div></div>
   <div class="card"><div class="card-h"><h2>This Month</h2><span class="chip">${inMonth.length}</span></div><div class="card-b list">

/* ---------- 5. Programme Schedule ---------- */
function vProgrammes(){
  const Y=curYear(), ws=active();
  const progs=PROGRAMMES.map((p,i)=>{ const list=ws.filter(w=>w.programme===p); const done=list.filter(w=>w.status==='Completed').length; const live=list.filter(w=>w.status!=='Cancelled'&&w.status!=='Draft').length; return {p,list,done,live,dept:DEPTS[0]}; });
  const pos=s=>{ const d=pd(s); return d.getFullYear()<Y?0:d.getFullYear()>Y?100:((d.getMonth()+(d.getDate()-1)/31)/12*100); };
  return head('Programme Schedule',`Workshops grouped under ${PROGRAMMES.length} programmes for ${Y}.`,`${isStaffRole()?`<button class="btn" data-action="toast" data-msg="Creating new programmes will be available in the next phase.">${ic('plus')} New Programme</button>`:''}`)+
  `<div class="grid g3">${progs.map(g=>`<div class="card prog"><div class="top"><div><b style="color:var(--navy)">${esc(g.p)}</b><br><small>${esc(g.dept)}</small></div><span class="chip">${g.list.length} workshops</span></div>
    <div class="progress"><i style="width:${g.live?g.done/g.live*100:0}%"></i></div><small>${g.done} of ${g.live} completed · ${g.list.filter(w=>w.status==='Upcoming'||w.status==='Ongoing').length} upcoming/ongoing</small></div>`).join('')}</div>
  <div class="card mt"><div class="card-h"><div><h2>${Y} Programme Timeline</h2><div class="hint">Each bar is one workshop. Hover for details, click to open.</div></div><div class="legend"><span><i style="background:#4A2C1D"></i>Completed</span><span><i style="background:#14A098"></i>Upcoming / Ongoing</span><span><i style="background:#F87171"></i>Cancelled</span></div></div>
   <div class="card-b gantt"><div class="gantt-row" style="border-bottom:1px solid var(--line)"><div></div><div class="gantt-months">${MON.map(m=>`<span>${m}</span>`).join('')}</div></div>
   ${progs.map(g=>`<div class="gantt-row"><div class="nm">${esc(g.p)}</div><div class="track">${g.list.filter(w=>w.status!=='Draft'&&pd(w.start).getFullYear()===Y).map(w=>{const l=pos(w.start),r=pos(w.end||w.start);return `<span class="gbar ${w.status==='Completed'?'c':w.status==='Cancelled'?'x':''}" style="left:${l}%;width:calc(${Math.max(r-l,0)}% + 6px);cursor:pointer" data-action="view" data-id="${w.id}" title="${esc(w.title)} · ${fmtRange(w.start,w.end)}"></span>`}).join('')}</div></div>`).join('')}
   </div></div>`;
}

/* ---------- 6. Reports ---------- */
function vReports(){
  const ws=scoped(active()), Y=curYear();
  const bud=ws.filter(w=>w.budget!==''&&w.budget!=null), tB=bud.reduce((a,w)=>a+(+w.budget||0),0), tA=ws.reduce((a,w)=>a+(+w.actualCost||0),0), nA=ws.filter(w=>w.actualCost!==''&&w.actualCost!=null).length;
  const costDept=PROGS_ALL().map(d=>[d,ws.filter(w=>w.programme===d).reduce((a,w)=>a+(+w.actualCost||0),0)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
  const byCat=CATS.map(c=>[c,ws.filter(w=>w.category===c).length]).sort((a,b)=>b[1]-a[1]);
  const byDept=PROGS_ALL().map(d=>[d,ws.filter(w=>w.programme===d).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
  const seats=ws.filter(w=>w.status==='Completed').reduce((a,w)=>a+(+w.seats||0),0);
  const totalDays=ws.filter(w=>w.status==='Completed').reduce((a,w)=>a+days(w),0);
  const compRate=Math.round(ws.filter(w=>w.status==='Completed').length/Math.max(1,ws.filter(w=>['Completed','Cancelled'].includes(w.status)).length)*100);
  return head('Reports & Statistics','Summary figures and breakdowns based on the shared workshop records.',
    `<button class="btn" data-action="pdf-month">${ic('calendar')} Monthly Report (PDF)</button><button class="btn primary" data-action="xl-report">${ic('download')} Export Report (Excel)</button><button class="btn" data-action="pdf-report">${ic('download')} Download PDF</button>`)+
  `<div class="grid g4">${[['Workshops this year',ws.filter(w=>pd(w.start).getFullYear()===Y).length],['Training days delivered',totalDays],['Planned seats (completed)',seats.toLocaleString()],['Completion rate',compRate+'%']].map(k=>`<div class="card kpi" style="cursor:default"><div><div class="lbl">${k[0]}</div><div class="val">${k[1]}</div></div></div>`).join('')}</div>
  ${kpiCard()}
  <div class="grid g3 mt">
    <div class="card"><div class="card-h"><h2>By Status</h2></div><div class="card-b">${donut(STATUSES.map(s=>({name:s,v:ws.filter(w=>w.status===s).length,color:STATUS_COLOR[s]})),'workshops')}
      <div class="legend" style="justify-content:center;margin-top:10px">${STATUSES.map(s=>`<span><i style="background:${STATUS_COLOR[s]}"></i>${s} (${ws.filter(w=>w.status===s).length})</span>`).join('')}</div></div></div>
    <div class="card"><div class="card-h"><h2>By Category</h2></div><div class="card-b">${hbars(byCat,'#14A098')}</div></div>
    <div class="card"><div class="card-h"><h2>By Programme</h2></div><div class="card-b">${hbars(byDept,'#0F766E')}</div></div>
  </div>
  <div class="card mt"><div class="card-h"><div><h2>Budget & Cost</h2><div class="hint">${bud.length} of ${ws.length} workshops have a budget recorded · ${nA} have an actual cost</div></div></div><div class="card-b">
    <div class="budget-grid"><div><small>Total budget</small><b>${RM(tB)}</b></div><div><small>Actual spent</small><b>${RM(tA)}</b></div><div><small>${tA>tB?'Over budget':'Remaining'}</small><b style="color:${tA>tB?'#B91C1C':'#0F766E'}">${RM(Math.abs(tB-tA))}</b></div><div><small>Budget used</small><b>${tB?Math.round(tA/tB*100):0}%</b></div></div>
    ${costDept.length?`<h3 style="margin-top:18px">Actual cost by programme</h3>${costDept.map(([k,v])=>`<div class="hbar" style="grid-template-columns:260px 1fr 110px"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(k)}</span><div class="tr"><i style="width:${v/costDept[0][1]*100}%;background:#8B5E3C"></i></div><b>${RM(v)}</b></div>`).join('')}`:'<div class="placeholder" style="margin-top:14px">No costs recorded yet. Add Budget and Actual Cost when editing a workshop, or include them in an Excel import.</div>'}
  </div></div>
  <div class="card mt"><div class="card-h"><h2>Programme Summary · ${Y}</h2></div>
   <div class="table-wrap" style="padding:12px 18px 18px"><table class="tbrand"><thead><tr><th>Programme</th>${STATUSES.map(s=>`<th style="text-align:center">${s}</th>`).join('')}<th style="text-align:center">Total</th></tr></thead><tbody>
   ${PROGS_ALL().filter(d=>ws.some(w=>w.programme===d)).map(d=>{const l=ws.filter(w=>w.programme===d);return `<tr><td><b>${esc(d)}</b></td>${STATUSES.map(s=>`<td style="text-align:center">${l.filter(w=>w.status===s).length||'–'}</td>`).join('')}<td style="text-align:center"><b>${l.length}</b></td></tr>`}).join('')}
   </tbody></table></div></div>`;
}

const PHOTOS={list:[]};
function idb(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('mpc-wms-photos',1); r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e);} }); }
async function loadPhotos(){ if(SHARED) return; try{ const db=await idb(); const req=db.transaction('photos','readonly').objectStore('photos').getAll(); const got=await new Promise(r=>{req.onsuccess=()=>r(req.result||[]);req.onerror=()=>r([]);}); if(!SHARED) PHOTOS.list=got; }catch(e){} }
async function putPhoto(p){ PHOTOS.list.push(p); try{ const db=await idb(); db.transaction('photos','readwrite').objectStore('photos').put(p);}catch(e){} }
async function delPhoto(id){ if(SHARED){ const p=PHOTOS.list.find(x=>x.id===id); await sharedWrite(db=>db.doc('photos/'+id).delete()); try{ if(p&&p.asset&&SHARED.assets) await SHARED.assets.delete(p.asset); }catch(e){} return; } PHOTOS.list=PHOTOS.list.filter(p=>p.id!==id); try{ const db=await idb(); db.transaction('photos','readwrite').objectStore('photos').delete(id);}catch(e){} }
const photosFor = wid => { const all=[...(SEED_PHOTOS[wid]||[]), ...PHOTOS.list.filter(p=>p.wid===wid).sort((a,b)=>(a.day||'').localeCompare(b.day||'')||a.at.localeCompare(b.at))]; const cv=(byId(wid)||{}).cover; if(cv){ const i=all.findIndex(p=>p.id===cv); if(i>0) all.unshift(all.splice(i,1)[0]); } return all; };
function waitList(){
  if(!isStaffRole()) return '';
  const l=active().filter(w=>(w.status==='Completed'||w.status==='Ongoing')&&!photosFor(w.id).length).sort((a,b)=>b.start.localeCompare(a.start)).slice(0,3);
  if(!l.length) return '';
  return `<h3 style="margin:16px 0 4px">Waiting for photos</h3>${l.map(w=>`<div class="attn-row" data-action="diary" data-id="${w.id}"><span class="attn-ic l3">${ic('camera')}</span><div style="min-width:0;flex:1"><b>${esc(w.title)}</b><small>${fmtRange(w.start,w.end)}</small></div>${canUpload()?`<button class="btn sm" data-action="upload" data-id="${w.id}">${ic('upload')}</button>`:''}</div>`).join('')}`;
}
const wDays = w => { const out=[]; const a=pd(w.start), b=pd(w.end||w.start); for(let d=new Date(a); d<=b && out.length<31; d.setDate(d.getDate()+1)) out.push(iso(d)); return out; };
function galleryHTML(w,ph){
  const cell=(p,i)=>`<div class="ph" data-action="lb" data-id="${w.id}" data-i="${i}"><img src="${p.src}" alt="${esc(p.caption)}" loading="lazy">${w.cover===p.id?'<span class="star">★ Cover</span>':''}<div class="cap">${esc(p.caption||'')}</div></div>`;
  const ds=wDays(w);
  if(ds.length<2 || !ph.some(p=>p.day)) return ph.map(cell).join('');
  let html=''; const idx=p=>ph.indexOf(p);
  ds.forEach((d,n)=>{ const l=ph.filter(p=>p.day===d); if(l.length) html+=`<div class="day-h">Hari ${n+1} · ${fmtMY(d)}</div>`+l.map(p=>cell(p,idx(p))).join(''); });
  const rest=ph.filter(p=>!p.day||!ds.includes(p.day)); if(rest.length) html+=`<div class="day-h">Other photos</div>`+rest.map(p=>cell(p,idx(p))).join('');
  return html;
}

const diaryEligible = () => active().filter(w=>w.status==='Completed'||w.status==='Ongoing').sort((a,b)=>b.start.localeCompare(a.start));

/* Upload modal */
let PENDING=[];
const dayFor = wid => { const w=byId(wid); const ds=w?wDays(w):[]; return ds.length>1 ? (state.upDay&&ds.includes(state.upDay)?state.upDay:ds[0]) : (ds[0]||''); };
function openUpload(wid){
  PENDING=[]; state.upWid=wid||''; state.upDay=''; renderUpload(); document.getElementById('overlay').classList.add('open');
}
function renderUpload(){
  const m=document.getElementById('modal'); m.className='modal';
  const opts=diaryEligible();
  m.innerHTML=`<div class="modal-h"><h2>Upload Photos to SPPE Diary</h2><button class="btn ghost sm" data-action="close">✕</button></div>
  <div class="modal-b">
    <div class="field" style="margin-bottom:14px"><label>Workshop / Programme <span class="req">*</span></label>
      <select id="upWid"><option value="">Select a workshop…</option>${opts.map(w=>`<option value="${w.id}" ${state.upWid===w.id?'selected':''}>${esc(w.title)} · ${fmtRange(w.start,w.end)}</option>`).join('')}</select></div>
    ${(()=>{ const w=byId(state.upWid); const ds=w?wDays(w):[]; return ds.length>1?`<div class="field" style="margin-bottom:14px"><label>Which day were these photos taken?</label><select id="upDay">${ds.map((d,n)=>`<option value="${d}" ${state.upDay===d?'selected':''}>Hari ${n+1} · ${fmtMY(d)}</option>`).join('')}</select></div>`:''; })()}
    <div class="dropzone" id="dz">${ic('upload')}<b>Drag photos here or click to choose</b>JPG or PNG · several at once is fine · large photos are resized automatically</div>
    <input type="file" id="upFiles" accept="image/*" multiple hidden>
    <div class="pend">${PENDING.map((p,i)=>`<div><img src="${p.src}"><button data-action="unpend" data-i="${i}" title="Remove">✕</button><input data-pi="${i}" value="${esc(p.caption)}" placeholder="Add a caption…"></div>`).join('')}</div>
  </div>
  <div class="modal-f"><span style="margin-right:auto;font-size:12.5px;color:var(--muted);align-self:center">${PENDING.length} photo${PENDING.length===1?'':'s'} ready</span><button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="do-upload" ${PENDING.length?'':'disabled'}>${ic('upload')} Upload</button></div>`;
  const dz=document.getElementById('dz'), fi=document.getElementById('upFiles');
  dz.onclick=()=>fi.click();
  fi.onchange=()=>addFiles(fi.files);
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};
  dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');addFiles(e.dataTransfer.files);};
  document.getElementById('upWid').onchange=e=>{ state.upWid=e.target.value; state.upDay=''; renderUpload(); };
  const ud=document.getElementById('upDay'); if(ud){ if(!state.upDay) state.upDay=ud.value; ud.onchange=e=>state.upDay=e.target.value; }
}
function resizeFile(file,max=1600){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); c.toBlob(b=>res({src:c.toDataURL('image/jpeg',.85),blob:b}),'image/jpeg',.85); }; img.onerror=rej; img.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); }); }
async function addFiles(files){
  for(const f of [...files].filter(f=>f.type.startsWith('image/'))){ try{ const r=await resizeFile(f); PENDING.push({src:r.src,blob:r.blob,caption:f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ')}); }catch(e){} }
  renderUpload();
}
async function doUpload(){
  const wid=state.upWid; if(!wid){ document.getElementById('upWid').closest('.field').classList.add('err'); toast('Please choose which workshop these photos belong to.'); return; }
  const now=new Date().toISOString();
  if(SHARED){
    if(!SHARED.assets){ toast('Your access level cannot upload photos.'); return; }
    const btn=document.querySelector('[data-action=do-upload]'); if(btn){ btn.disabled=true; btn.textContent='Uploading…'; }
    let n=0;
    for(const p of PENDING){ try{ const up=await SHARED.assets.upload(p.blob); await SHARED.db.collection('photos').add({wid,day:dayFor(wid),asset:up.id,url:up.url,caption:p.caption,uid:SHARED.uid||'',by:SHARED.name,at:new Date().toISOString()}); n++; }catch(e){ writeFail(e); break; } }
    if(!n){ renderUpload(); return; }
    PENDING=PENDING.slice(0,n);
  } else {
    for(const [i,p] of PENDING.entries()) await putPhoto({id:'u-'+Date.now()+'-'+i,wid,day:dayFor(wid),src:p.src,caption:p.caption,by:ME(),at:now});
  }
  log(`uploaded ${PENDING.length} photo${PENDING.length>1?'s':''} to the SPPE Diary for`,wid); save();
  toast(`${PENDING.length} photo${PENDING.length>1?'s':''} added to the SPPE Diary.`);
  PENDING=[]; closeModal(); state.currentId=wid; go('workshop-diary');
}

function openDiaryEdit(wid){
  const w=byId(wid), d=diaryFor(wid), m=document.getElementById('modal'); m.className='modal';

function normDate(v){
  if(v instanceof Date && !isNaN(v)) return iso(new Date(v.getTime()+12*3600e3));
  if(typeof v==='number' && v>20000){ const d=new Date(Math.round((v-25569)*864e5)); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`; }
  const s=String(v??'').trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
function normTime(v){
  if(v===''||v==null) return '';
  if(v instanceof Date && !isNaN(v)){ const d=new Date(v.getTime()+30e3); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
  if(typeof v==='number'){ const mins=Math.round((v%1)*1440); return `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`; }
  const m=String(v).trim().match(/^(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm|pagi|petang|ptg)?$/i); if(!m) return '';
  let h=+m[1]; const mi=m[2]||'00', ap=(m[3]||'').toLowerCase();
  if((ap==='pm'||ap==='petang'||ap==='ptg') && h<12) h+=12; if(ap==='am'&&h===12) h=0;
  return h<24 ? `${String(h).padStart(2,'0')}:${mi}` : '';
}
function normDept(v){ return SPPE; }
function normDeptOld(v){ const t=String(v??'').trim(); if(!t||/^sppe$/i.test(t)||/prestasi produktiviti/i.test(t)) return SPPE; return DEPTS.find(d=>d.toLowerCase()===t.toLowerCase())||t; }
function normRow(raw){
  const r={}; Object.entries(raw).forEach(([k,v])=>{ const key=HMAP[String(k).toLowerCase().replace(/[^a-z]/g,'')]; if(key && r[key]===undefined) r[key]=v; });

    startTime:normTime(r.startTime)||'09:00', endTime:normTime(r.endTime)||'17:00', venue:String(r.venue??'').trim(), programme:String(r.programme??'').trim()||'Standalone workshop',
    description:String(r.description??'').trim(), seats:r.seats!==''&&r.seats!=null&&!isNaN(+r.seats)?+r.seats:'', budget:r.budget!==''&&r.budget!=null&&!isNaN(+r.budget)?+r.budget:'', actualCost:r.actualCost!==''&&r.actualCost!=null&&!isNaN(+r.actualCost)?+r.actualCost:'' };
  const st=String(r.status??'').trim().toLowerCase(); w.status=STATUS_ALIAS[st]||(st?'':'Upcoming');
  const cat=String(r.category??'').trim(); w.category=CATS.find(c=>c.toLowerCase()===cat.toLowerCase())||cat||'Productivity';
  const md=String(r.mode??'').trim().toLowerCase(); w.mode=/online|maya|virtual/.test(md)?'Online':/hybrid|hibrid/.test(md)?'Hybrid':'Physical';
  if(!w.end) w.end=w.start;
  const err=[]; if(!w.title) err.push('Title missing'); if(!w.start) err.push('Start date missing or unreadable'); if(!w.venue) err.push('Venue missing');
  if(!w.status) err.push('Unknown status “'+r.status+'”'); if(w.start&&w.end&&w.end<w.start) err.push('End date before start date');
  const ex = (w.id && byId(w.id)) || DB.workshops.find(x=>x.title.toLowerCase()===w.title.toLowerCase() && x.start===w.start);
  return {w, err, update: ex ? ex.id : ''};
}

const REG_NOTIFY_DAYS=7; // show self-registrations from the last 7 days
function attention(){
  if(!isStaffRole()) return [];
  const now=new Date(); now.setHours(0,0,0,0); const T=iso(now), out=[];
  const dd=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
  active().forEach(w=>{
    if(w.approval&&w.approval.state==='pending'&&state.role==='admin') out.push({w,k:'appr',lvl:1,t:'Waiting for your approval',ic:'clock'});
    if(w.approval&&w.approval.state==='rejected'&&(w.approval.reqUid?w.approval.reqUid===(SHARED&&SHARED.uid):true)&&can('edit')) out.push({w,k:'rej',lvl:1,t:'Returned for changes',ic:'info'});
    if(w.status==='Upcoming'&&w.start>=T&&dd(w.start,T)<=7) out.push({w,k:'soon',lvl:2,t:dd(w.start,T)===0?'Starts today':`Starts in ${dd(w.start,T)} day${dd(w.start,T)>1?'s':''} — confirm venue & materials`,ic:'calendar'});
    if(['Upcoming','Draft','Ongoing'].includes(w.status)&&(w.end||w.start)>=T){ const cl=findClashes(w,w.id); if(cl.length){ const x=cl[0]; out.push({w,k:'clash',lvl:0,t:`Schedule clash with “${x.title}” · ${x.venue} · ${fmtRange(x.start,x.end)}, ${fmtTime(x)}${cl.length>1?` (+${cl.length-1} more)`:''}`,ic:'info'}); } }
    if(w.status==='Upcoming'&&w.start<T) out.push({w,k:'late',lvl:1,t:'Start date has passed — please update the status',ic:'info'});
    if(w.status==='Ongoing'&&(w.end||w.start)<T) out.push({w,k:'end',lvl:1,t:`Ended ${fmtD(w.end||w.start)} — mark as Completed`,ic:'done',act:'complete'});
    if(fbOpen(w)&&dd(T,w.end||w.start)<=30){ const nr=regsFor(w.id).length, nf=fbFor(w.id).length; if(nr>nf && fbLeft(w)>=0) out.push({w,k:'fb',lvl:2,t:`${nr-nf} participant${nr-nf>1?'s have':' has'} not answered the feedback form`,ic:'pen'}); }
    { const cut=Date.now()-REG_NOTIFY_DAYS*864e5, nr=regsFor(w.id).filter(r=>!r.external && !String(r.key).startsWith('ext-') && r.at && new Date(r.at).getTime()>=cut);
      if(nr.length){ const last=nr[nr.length-1]; out.push({w,k:'reg',lvl:2,t:`${nr.length} new registration${nr.length>1?'s':''} · latest ${last.name||'a participant'} · ${timeAgo(last.at)}`,ic:'users',act:'regs',at:last.at}); } }
    if(w.status==='Completed'&&dd(T,w.end||w.start)<=60&&!photosFor(w.id).length) out.push({w,k:'photo',lvl:3,t:'No SPPE Diary photos yet',ic:'camera',act:'photos'});
  });
  const rg=x=>x.k==='clash'?-1:x.k==='reg'?0:1; return out.sort((a,b)=>rg(a)-rg(b)||(a.k==='reg'&&b.k==='reg'?(b.at||'').localeCompare(a.at||''):0)||a.lvl-b.lvl||a.w.start.localeCompare(b.w.start));
}
function attnRow(x){

  ${x.act==='complete'&&can('edit')?`<button class="btn sm" data-action="mark-complete" data-id="${x.w.id}">Mark Completed</button>`:x.act==='photos'&&canUpload()?`<button class="btn sm" data-action="upload" data-id="${x.w.id}">${ic('upload')} Upload</button>`:x.k==='clash'&&can('edit')?`<button class="btn sm danger" data-action="edit" data-id="${x.w.id}">${ic('edit')} Fix</button>`:x.k==='appr'?`<button class="btn sm primary" data-action="view" data-id="${x.w.id}">Review</button>`:x.k==='reg'?`<button class="btn sm" data-action="view" data-id="${x.w.id}">${ic('users')} View participants</button>`:''}</div>`;
}
function openAlerts(){
  const list=attention(), m=document.getElementById('modal'); m.className='modal';
  m.innerHTML=`<div class="modal-h"><h2>Reminders & Notifications</h2><button class="btn ghost sm" data-action="close">✕</button></div>
  <div class="modal-b" style="padding-top:8px">${list.length?list.map(attnRow).join(''):'<div class="empty">Nothing needs your attention right now.</div>'}</div>`;
  document.getElementById('overlay').classList.add('open');
}

/* ---- SPPE Diary: poster ---- */
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); if(!src.startsWith('data:')) i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
function coverDraw(ctx,img,x,y,w,h){ const s=Math.max(w/img.width,h/img.height), sw=w/s, sh=h/s; ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,w,h); }
async function buildPoster(w){
  try{ await document.fonts.load('800 40px "Plus Jakarta Sans"'); await document.fonts.load('700 24px "Plus Jakarta Sans"'); }catch(e){}
  const F='"Plus Jakarta Sans", Arial, sans-serif', c=document.createElement('canvas'); c.width=1080; c.height=1080; const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,1080,1080);
  try{ const lg=await loadImg(MPC_LOGO); const h=74, lw=lg.width*h/lg.height; x.drawImage(lg,36,30,lw,h); }catch(e){}
  x.textAlign='right'; x.fillStyle='#111'; x.font=`800 32px ${F}`; const dt=fmtRangeMY(w.start,w.end); x.fillText(dt,1044,62);
  const dw=Math.max(260,x.measureText(dt).width+20); x.fillStyle='#E31E24'; x.fillRect(1044-dw,74,dw,4);
  x.fillStyle='#111'; x.font=`800 22px ${F}`; x.fillText(String(w.venue).split(',')[0].slice(0,40),1044,108);
  x.textAlign='center'; x.font=`800 38px ${F}`; const words=w.title.toUpperCase().split(/\s+/), lines=[]; let cur='';
  words.forEach(t=>{ const tryL=cur?cur+' '+t:t; if(x.measureText(tryL).width>900&&cur){ lines.push(cur); cur=t; } else cur=tryL; }); if(cur) lines.push(cur);
  const L=lines.slice(0,4); let y=200; L.forEach(l=>{ x.fillText(l,540,y); y+=48; });
  const ph=photosFor(w.id).filter(p=>!p.poster).slice(0,2), top=y+10, bottom=990, X0=120, W=840;
  if(ph.length){
    const imgs=[]; for(const p of ph){ try{ imgs.push(await loadImg(p.src)); }catch(e){} }
    if(imgs.length===1) coverDraw(x,imgs[0],X0,top,W,bottom-top);
    else if(imgs.length>=2){ const hh=(bottom-top-6)/2; coverDraw(x,imgs[0],X0,top,W,hh); coverDraw(x,imgs[1],X0,top+hh+6,W,hh); }
  } else { x.fillStyle='#F3EAE2'; x.fillRect(X0,top,W,bottom-top); x.fillStyle='#8A7B70'; x.font=`600 24px ${F}`; x.fillText('Upload photos to include them in the poster',540,(top+bottom)/2); }
  x.fillStyle='#E31E24'; x.fillRect(0,1016,1080,64);
  x.font=`800 30px ${F}`; const parts=[['#Memacu','#111'],['PRODUKTIVITI','#fff'],['Negara','#111']]; const tw=parts.reduce((a,p)=>a+x.measureText(p[0]).width,0); let px=540-tw/2; x.textAlign='left';
  parts.forEach(([t,col])=>{ x.fillStyle=col; x.fillText(t,px,1059); px+=x.measureText(t).width; });
  return c;
}
async function openPoster(id){
  const w=byId(id), m=document.getElementById('modal'); m.className='modal';
  m.innerHTML=`<div class="modal-h"><h2>Diary Poster (1080 × 1080)</h2><button class="btn ghost sm" data-action="close">✕</button></div><div class="modal-b" style="text-align:center"><div class="empty">Creating poster…</div></div>`;
  document.getElementById('overlay').classList.add('open');
  let c; try{ c=await buildPoster(w); }catch(e){}
  let url=''; try{ url=c.toDataURL('image/png'); }catch(e){}
  const b=m.querySelector('.modal-b');
  if(!url){ b.innerHTML='<div class="empty">The poster could not be created with these photos. Try choosing a different cover photo.</div>'; return; }
  state.posterCanvas=c;
  b.innerHTML=`<img src="${url}" alt="Poster preview" style="width:100%;max-width:540px;border-radius:10px;border:1px solid var(--line)"><p style="font-size:12.5px;color:var(--muted);margin:10px 0 0">Uses the cover photo and the next photo. Ready for Instagram, Facebook or WhatsApp.</p>`;
  m.insertAdjacentHTML('beforeend',`<div class="modal-f"><button class="btn" data-action="close">Close</button><button class="btn primary" data-action="dl-poster" data-id="${id}">${ic('download')} Download PNG</button></div>`);
}

function trS(s){
  if(LANG!=='bm' || s==null) return s;
  const t=String(s).trim(); if(!t) return s;
  let r=BM[t];
  if(r===undefined){ for(const [rx,f] of BM_RX){ const m=t.match(rx); if(m){ if(f) r=f(...m.slice(1)); break; } } }
  return r===undefined ? s : String(s).replace(t,r);
}
const T = s => trS(s);
const ORIG=new WeakMap(), ATTRS=['placeholder','title','aria-label'];
function trNode(root){
  if(!root) return;
  if(root.nodeType===3){ trText(root); return; }
  if(root.nodeType!==1) return;
  if(root.closest && root.closest('script,style,textarea,.nt')) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT); let n=root;
  do{
    if(n.nodeType===3) trText(n);
    else if(n.nodeType===1){
      if(/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.tagName)||n.classList.contains('nt')) continue;
      if(n.tagName==='OPTION' && !n.hasAttribute('value')) n.setAttribute('value',n.textContent);
      ATTRS.forEach(a=>{ if(n.hasAttribute(a)){ const k='data-en-'+a; if(!n.hasAttribute(k)) n.setAttribute(k,n.getAttribute(a)); n.setAttribute(a, LANG==='bm'?trS(n.getAttribute(k)):n.getAttribute(k)); } });
      if(n.dataset && n.dataset.action && !/^(BUTTON|A|INPUT|SELECT|TEXTAREA|OPTION)$/.test(n.tagName) && !n.hasAttribute('tabindex')){ n.setAttribute('tabindex','0'); n.setAttribute('role','button'); }
    }
  } while((n=w.nextNode()));
}
function trText(n){
  const p=n.parentElement; if(!p || p.closest('script,style,textarea,.nt')) return;
  if(!ORIG.has(n)) ORIG.set(n,n.nodeValue);
  const o=ORIG.get(n), v= LANG==='bm' ? trS(o) : o;
  if(n.nodeValue!==v) n.nodeValue=v;
}
const trObs=new MutationObserver(ms=>{ ms.forEach(m=>m.addedNodes.forEach(trNode)); });
function setLang(l){
  LANG=l; try{ localStorage.setItem('wms-lang',l); }catch(e){}
  MON.splice(0,12,...(l==='bm'?MON_BM:MON_EN)); MONTHS.splice(0,12,...(l==='bm'?MONTHS_BM:MONTHS_EN));
  document.documentElement.lang = l==='bm'?'ms':'en';
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.v===l));
  render(); trNode(document.body);
}

/* ---- Auto status by date ---- */
const autoOn = () => !(DB.settings && DB.settings.autoStatus===false);
function autoChanges(){
  const T=iso(new Date()), out=[];
  DB.workshops.forEach(w=>{
    if(w.archived) return; const end=w.end||w.start; let ns=null;
    if(w.status==='Upcoming'){ if(end<T) ns='Completed'; else if(w.start<=T) ns='Ongoing'; }
    else if(w.status==='Ongoing' && end<T) ns='Completed';
    if(ns) out.push([w,ns]);
  });
  return out;
}
let autoBusy=false;
async function runAutoStatus(){
  if(autoBusy || !autoOn()) return; const ch=autoChanges(); if(!ch.length) return;
  if(SHARED){
    if(!isStaffRole()) return;
    autoBusy=true;
    try{ const lease=await SHARED.db.doc('meta/autostatus').acquire({holder:SHARED.uid||('tab-'+Math.random()),ttlMs:30000}); if(!lease||!lease.acquired){ autoBusy=false; return; } }catch(e){ autoBusy=false; return; }
  }

function addWorkdays(ds,n){ const d=pd(ds); let c=0; while(c<n){ d.setDate(d.getDate()+1); const g=d.getDay(); if(g!==0&&g!==6) c++; } return iso(d); }
function workdaysBetween(a,b){ if(b<a) return 0; const d=pd(a); let c=0; while(iso(d)<b){ d.setDate(d.getDate()+1); const g=d.getDay(); if(g!==0&&g!==6) c++; } return c; }

const fbOpen = w => fbEnded(w) && iso(new Date()) <= fbDeadline(w);
const fbLeft = w => { const T=iso(new Date()), dl=fbDeadline(w); if(T>dl) return -1; const n=workdaysBetween(T,dl); const g=new Date().getDay(); return n + ((g!==0&&g!==6)?1:0); };

function olNorm(e){

  const ev=e.end&&typeof e.end==='object'?e.end.dateTime:(e.end||e.endDateTime||e.endTime||sv);
  if(!subject||!sv) return null;
  let start=String(sv).slice(0,10), end=String(ev||sv).slice(0,10), st=String(sv).slice(11,16)||'09:00', et=String(ev||'').slice(11,16)||'17:00';
  if(e.isAllDay || (st==='00:00' && et==='00:00')){ if(end>start){ const d=pd(end); d.setDate(d.getDate()-1); end=iso(d); } st='09:00'; et='17:00'; }

  const org=e.organizer&&(e.organizer.emailAddress?(e.organizer.emailAddress.name||e.organizer.emailAddress.address):(e.organizer.name||e.organizer))||'';
  const online=!!(e.isOnlineMeeting||/teams|zoom|webex|online/i.test(loc));
  return {oid:String(e.id||e.uri||e.iCalUId||e.webLink||(subject+start)), subject, start, end, startTime:st, endTime:et, venue:loc||(online?'Online (Microsoft Teams)':''), organizer:String(org||''), online, body:String(e.bodyPreview||e.preview||'').slice(0,400), category:olGuessCat(subject+' '+(e.bodyPreview||''))};
}

async function olCheck(interactive){
