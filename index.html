/* ---- 1. Schedule clash detection: same venue + overlapping date + overlapping time ---- */
const normV = v => String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const venueMatch = (a,b) => !!a && !!b && (a===b || (Math.min(a.length,b.length)>=5 && (a.includes(b) || b.includes(a))));
const tOverlap = (a,b) => (a.startTime||'09:00') < (b.endTime||'17:00') && (b.startTime||'09:00') < (a.endTime||'17:00');
function findClashes(d, exclId){
  const out=[];
  if(!d || !d.start || !d.venue || d.archived || d.status==='Cancelled' || d.mode==='Online') return out;
  const e=d.end||d.start, v=normV(d.venue);
  DB.workshops.forEach(x=>{
    if(x.id===exclId || x.archived || x.status==='Cancelled' || !x.start || x.mode==='Online') return;
    const xe=x.end||x.start;
    const xv=normV(x.venue);
    if(x.start<=e && d.start<=xe && venueMatch(v,xv) && tOverlap(d,x)) out.push(x);
  });
  return out;
}
const clashWhen = x => `${fmtRange(x.start,x.end)}, ${fmtTime(x)}`;
function clashHTML(cl, opts={}){
  if(cl.length) return `<div class="clash hard" role="alert">${ic('info')}<div><b>Schedule clash found</b> — this venue is already booked at the same time:<ul>${cl.map(x=>`<li>“${esc(x.title)}” · ${esc(x.venue)} · ${clashWhen(x)}</li>`).join('')}</ul>${opts.confirm?'<div class="cf">Click Save again to save anyway, or change the date, time or venue.</div>':''}</div></div>`;
  return opts.showOk ? `<div class="clash ok">${ic('check')}<div>No schedule clash: this venue is free at that date and time.</div></div>` : '';
}
function formDraft(f){ const d=Object.fromEntries(new FormData(f).entries()); Object.keys(d).forEach(k=>d[k]=String(d[k]).trim()); if(!d.end) d.end=d.start; return d; }
function renderClash(f,w,confirm){
  const box=document.getElementById('clashBox'); if(!box) return;
  const d=formDraft(f);
  box.innerHTML = (d.start && d.venue) ? clashHTML(findClashes(d, w&&w.id), {confirm, showOk:true}) : '';
  box.style.display = box.innerHTML ? '' : 'none';
  if(typeof trNode==='function') trNode(box);
}
function clashBanner(w){
  if(w.archived || w.status==='Completed' || w.status==='Cancelled') return '';
  const cl=findClashes(w,w.id); if(!cl.length) return '';
  return `<div class="clash-banner">${clashHTML(cl)}</div>`;
}
const clashChip = w => (!w.archived && isStaffRole() && w.status!=='Completed' && findClashes(w,w.id).length) ? `<span class="chip-clash" title="Same venue at the same time as another workshop">${ic('info')} Clash</span>` : '';

const FIELD_LBL={title:'Title',category:'Category',start:'Start Date',end:'End Date',venue:'Venue',status:'Status',startTime:'Start Time',endTime:'End Time',programme:'Programme',mode:'Delivery Mode',seats:'Capacity',budget:'Budget (RM)',actualCost:'Actual Cost (RM)',regLink:'Registration link',fbLink:'Feedback link',objectives:'Objectives',description:'Description',archived:'Archived',approval:'Approval'};
const LONG_F=['objectives','description','regLink','fbLink'];
function diffW(oldW, d){
  const ch=[];
  Object.keys(FIELD_LBL).forEach(k=>{
    if(!(k in d) || k==='approval') return;
    const a=String(oldW[k]??''), b=String(d[k]??'');
    if(a!==b) ch.push(LONG_F.includes(k) ? {f:k,from:a?'(previous text)':'',to:b?'(updated)':'(removed)'} : {f:k,from:a,to:b});
  });
  return ch;
}
function auKind(a){
  const s=String(a.a||'').toLowerCase();

  if(/photo|diary/.test(s)) return 'diary';
  if(/status|marked|approv|returned|submitted|resubmit/.test(s)) return 'status';

const KPI_DEF=[['workshops','Workshops held',[6,6,6,6]],['participants','Participants reached',[180,180,180,180]],['days','Training days delivered',[8,8,8,8]]];
const kpiTargets = () => { const s=(DB.settings&&DB.settings.kpi)||{}; return Object.fromEntries(KPI_DEF.map(([k,,def])=>[k,(Array.isArray(s[k])&&s[k].length===4)?s[k].map(Number):def])); };
function kpiActuals(Y){
  const held=active().filter(w=>(w.status==='Completed'||w.status==='Ongoing') && pd(w.start).getFullYear()===Y);
  const q=w=>Math.floor(pd(w.start).getMonth()/3), out={workshops:[0,0,0,0],participants:[0,0,0,0],days:[0,0,0,0]};

}

const clashAlerts = () => attention().filter(x=>x.k==='clash');
let clashSeen=''; 
function clashPopup(){
  const list=clashAlerts(), bell=document.querySelector('[data-action=alerts]');

  const sig=list.map(x=>x.w.id).sort().join(',');
  const old=document.getElementById('clashAlert');
  if(!list.length || document.body.classList.contains('is-out')){ if(old) old.remove(); clashSeen=sig; return; }
  if(sig===clashSeen) return;
  let seen=''; try{ seen=sessionStorage.getItem('wms-clash-seen')||''; }catch(e){}
  if(sig===seen){ clashSeen=sig; return; }
  clashSeen=sig; if(old) old.remove();
  const n=list.length, el=document.createElement('div'); el.id='clashAlert'; el.className='clash-alert'; el.setAttribute('role','alert');
  el.innerHTML=`${ic('info')}<div style="flex:1;min-width:0"><b>${n} workshop${n>1?'s have':' has'} a schedule clash</b><small>${esc(list[0].w.title)}${n>1?` and ${n-1} more`:''}</small>
   <div class="row"><button class="btn sm danger" data-action="clash-open">View</button><button class="btn sm" data-action="clash-dismiss">Dismiss</button></div></div>`;
  document.body.appendChild(el); trNode(el);
}
